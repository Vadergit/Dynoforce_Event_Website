name: Validate grouped daily records

on:
  push:
    branches: ["feature/grouped-daily-records"]
    paths:
      - "scripts/group-daily-records.py"
      - ".github/workflows/group-daily-records.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/grouped-daily-records

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply markup change
        run: python3 scripts/group-daily-records.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add app/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Group daily records like live rankings"
          git push origin HEAD:feature/grouped-daily-records

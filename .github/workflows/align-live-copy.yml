name: Validate live alignment polish

on:
  push:
    branches: ["feature/live-centering-polish"]
    paths:
      - "scripts/align-live-copy.py"
      - ".github/workflows/align-live-copy.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/live-centering-polish

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply copy change
        run: python3 scripts/align-live-copy.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Polish guided live alignment and ranking title"
          git push origin HEAD:feature/live-centering-polish

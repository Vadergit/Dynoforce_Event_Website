name: Apply live ranking title

on:
  push:
    branches: ["feature/live-ranking-title"]
    paths:
      - "scripts/apply-live-ranking-title.py"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/live-ranking-title

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply heading change
        run: python3 scripts/apply-live-ranking-title.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Tighten live leaderboard heading"
          git push origin HEAD:feature/live-ranking-title

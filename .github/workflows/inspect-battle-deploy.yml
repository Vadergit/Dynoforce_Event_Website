name: Inspect battle deployment

on:
  push:
    branches: ["fix/battle-games-single-player"]
    paths:
      - ".github/workflows/inspect-battle-deploy.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract deployed battle game source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/battle
          cd /tmp/battle
          curl -L --fail --silent --show-error https://dynoforce.web.app/battle -o battle.html
          curl -L --fail --silent --show-error https://dynoforce.web.app/assets/index-vxyjGoE9.js -o battle.min.js
          curl -L --fail --silent --show-error https://dynoforce.web.app/assets/index-CLh0Mr_F.css -o battle.css

          npx --yes prettier@3.6.2 battle.min.js --parser babel > battle.pretty.js

          echo '=== GAME MARKER LINES ==='
          grep -niE 'Flappy|Pong|Squirrel|flappy|pong|squirrel' battle.pretty.js | head -100 || true

          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('battle.pretty.js').read_text(errors='ignore')
          lines = text.splitlines()
          markers = []
          for i,line in enumerate(lines):
              if re.search(r'Flappy|Pong|Squirrel|flappy|pong|squirrel', line):
                  markers.append(i)
          chosen=[]
          for i in markers:
              if not chosen or i-chosen[-1] > 80:
                  chosen.append(i)
          print('MARKERS', [i+1 for i in chosen[:20]])
          for n,i in enumerate(chosen[:20],1):
              print(f'\n===== CONTEXT {n} lines {max(1,i-90)+1}-{min(len(lines),i+180)+1} =====')
              for j in range(max(0,i-90), min(len(lines),i+180)):
                  print(f'{j+1:06d}: {lines[j]}')
          print('\n===== ASSET PATHS IN JS =====')
          assets=sorted(set(re.findall(r'["\']([^"\']+\.(?:png|svg|webp|jpg|jpeg|gif))["\']', text, re.I)))
          for a in assets:
              print(a)
          PY

          echo '=== BATTLE CSS MATCHES ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          css=Path('battle.css').read_text(errors='ignore')
          for term in ['battle','flappy','pong','squirrel']:
              print('\nTERM',term)
              for m in list(re.finditer(term, css, re.I))[:20]:
                  print(css[max(0,m.start()-500):m.start()+1200])
          PY

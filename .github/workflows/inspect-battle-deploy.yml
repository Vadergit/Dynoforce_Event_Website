name: Inspect battle deployment

on:
  push:
    branches: ["fix/battle-games-single-player"]
    paths:
      - ".github/workflows/inspect-battle-deploy.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Trace Battle route and embedded games
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/battle
          cd /tmp/battle
          curl -L --fail --silent --show-error https://dynoforce.web.app/assets/index-vxyjGoE9.js -o battle.min.js
          npx --yes prettier@3.6.2 battle.min.js --parser babel > battle.pretty.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('battle.pretty.js').read_text(errors='ignore').splitlines()
          patterns=[
            r'/battle', r'Two Grips', r'One Winner', r'Winner', r'Kraft-Preset',
            r'DynoGrip 1', r'DynoGrip 2', r'player1', r'player2', r'Player 1', r'Player 2',
            r'iframe', r'srcDoc', r'gameUrl', r'game.*html', r'dynoflight', r'helixdrop'
          ]
          seen=[]
          for pat in patterns:
            hits=[i for i,l in enumerate(lines) if re.search(pat,l,re.I)]
            print(f'\n### PATTERN {pat} HITS {[i+1 for i in hits[:30]]}')
            for i in hits[:8]:
              if any(abs(i-x)<40 for x in seen): continue
              seen.append(i)
              print(f'\n===== {pat} @ {i+1} =====')
              for j in range(max(0,i-70),min(len(lines),i+160)):
                print(f'{j+1:06d}: {lines[j]}')
          print('\n### URL-LIKE STRINGS NEAR GAME/BATTLE')
          text='\n'.join(lines)
          for m in re.finditer(r'["\']([^"\']*(?:battle|game|flappy|pong|dynoflight)[^"\']*)["\']',text,re.I):
            s=m.group(1)
            if len(s)<300: print(s)
          PY

name: Apply daily record holders

on:
  push:
    branches: ["feature/daily-record-holders-v3"]
    paths:
      - "scripts/apply-daily-record-holders.py"
      - ".github/workflows/apply-daily-record-holders.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/daily-record-holders-v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply feature
        run: python3 scripts/apply-daily-record-holders.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.js app/daily-leaders.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add optional daily record holders"
          git push origin HEAD:feature/daily-record-holders-v3

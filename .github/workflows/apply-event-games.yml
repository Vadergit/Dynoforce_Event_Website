name: Validate event single-player games

on:
  push:
    branches: ["feature/event-single-player-games"]
    paths:
      - "app/event-games.js"
      - "app/event-games.css"
      - "scripts/apply-event-games.py"
      - ".github/workflows/apply-event-games.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/event-single-player-games

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Integrate games into main app
        run: python3 scripts/apply-event-games.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate single-player games into event flow"
          git push origin HEAD:feature/event-single-player-games

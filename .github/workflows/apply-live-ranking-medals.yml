name: Validate live ranking medals

on:
  push:
    branches: ["feature/live-ranking-medals"]
    paths:
      - "scripts/apply-live-ranking-medals.py"
      - ".github/workflows/apply-live-ranking-medals.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/live-ranking-medals

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply medal change
        run: python3 scripts/apply-live-ranking-medals.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Use medals in guided live rankings"
          git push origin HEAD:feature/live-ranking-medals

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynoForce Event System</title>
  <link rel="icon" type="image/png" href="/dynoforce-icon.png" />
  <link rel="apple-touch-icon" href="/dynoforce-icon.png" />
  <link rel="stylesheet" href="/app/styles.css" />
  <link rel="stylesheet" href="/app/live-spacing.css" />
  <link rel="stylesheet" href="/app/daily-leaders.css" />
  <link rel="stylesheet" href="/app/live-alignment.css" />
  <link rel="stylesheet" href="/app/live-qr-nonclick.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app/main.js"></script>
  <script type="module" src="/app/squirrel-soundtrack.js"></script>
  <script>
    (() => {
      const app = document.getElementById("app");
      let activeGamesPage = null;

      const openDefaultSinglePlayerGame = () => {
        const gamesPage = app.querySelector(".event-games-page");
        if (!gamesPage) {
          activeGamesPage = null;
          return;
        }
        if (gamesPage === activeGamesPage) return;
        activeGamesPage = gamesPage;

        const selectedGame = gamesPage.querySelector(".event-game-card.is-selected");
        const defaultGame = gamesPage.querySelector('[data-event-game="flappy"]');
        if (!selectedGame && defaultGame) {
          queueMicrotask(() => {
            if (document.contains(defaultGame)) defaultGame.click();
          });
        }
      };

      new MutationObserver(openDefaultSinglePlayerGame).observe(app, {
        childList: true,
        subtree: true,
      });
      openDefaultSinglePlayerGame();
    })();
  </script>
</body>
</html>
